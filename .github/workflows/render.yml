name: Render Episode

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Resolusi: 1 = 1080x1920 (final), 0.5 = 540x960 (draf cepat)'
        default: '1'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Library sistem untuk Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund
      - name: Perbesar klip ke 1080x1920
        run: bash scripts/prep.sh
      - name: Siapkan browser
        run: npx remotion browser ensure
      - name: Render video
        run: |
          mkdir -p out
          npx remotion render src/index.ts EP out/ep.mp4 --scale=${{ inputs.scale }} --video-bitrate=8M --gl=swangle --log=info
      - name: Terbitkan ke Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ep-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "out/ep.mp4#ep_scale${{ inputs.scale }}.mp4" --title "Render $TAG" --notes "Skala: ${{ inputs.scale }}"
